id: chrome-devtools
name: Chrome DevTools
summary: "Drive and inspect a live Chrome browser from the agent: traces, performance profiles, console logs, and network requests."
description: "Google's Chrome DevTools MCP server, spawned locally via npx (chrome-devtools-mcp@latest). Gives coding agents the full DevTools surface over MCP: navigate, inspect, profile performance and read console/network. Runs a real browser locally, so the client asks for explicit confirmation before installing a stdio server."
author: Google
homepage_url: https://github.com/ChromeDevTools/chrome-devtools-mcp
trust: verified
version: 1.0.0
featured: false
categories:
  - browser
  - devtools
tags:
  - chrome
  - devtools
  - performance
  - debugging
surfaces:
  - coder
  - ide
  - editor
payload:
  kind: mcp
  transport: stdio
  serverLabel: chrome-devtools
  command: npx
  args:
    - "-y"
    - "chrome-devtools-mcp@latest"