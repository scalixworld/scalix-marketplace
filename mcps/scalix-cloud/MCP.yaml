id: scalix-cloud
name: Scalix Cloud
summary: "Provision and manage Scalix Cloud sandboxes, persistent Linux computers, ScalixNova Postgres, functions, storage, and AI."
description: Official Scalix Cloud MCP server over Streamable HTTP. Connects coding agents to serverless PostgreSQL (ScalixNova), serverless functions, isolated sandboxes, persistent Linux computers, object storage, and AI inference using a single API key read from SCALIX_API_KEY.
author: Scalix World
homepage_url: https://scalix.world/mcp
icon_url: https://scalix.world/scalix-logo.png
trust: official
version: 1.6.1
featured: true
categories:
  - cloud
  - development
tags:
  - scalix
  - cloud
  - postgres
  - sandboxes
  - functions
  - ai
surfaces:
  - coder
  - ide
  - editor
payload:
  kind: mcp
  transport: http
  serverLabel: scalix-cloud
  serverUrl: https://api.scalix.world/v1/mcp
  authorizationEnv: SCALIX_API_KEY
  requiredEnv:
    - SCALIX_API_KEY