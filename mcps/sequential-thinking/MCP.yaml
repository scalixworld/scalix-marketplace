id: sequential-thinking
name: Sequential Thinking
summary: Structured step-by-step problem solving that lets an agent plan, branch, and revise before committing to an answer.
description: The reference Sequential Thinking MCP server, spawned locally via npx (@modelcontextprotocol/server-sequential-thinking@2.2.0). Gives the model a tool for step-by-step reasoning with revision and branching. Runs locally, so the client asks for explicit confirmation before installing a stdio server.
