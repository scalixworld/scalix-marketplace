name: build-catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile the catalog (dist/listings)
        run: pnpm run generate

      - name: Verify dist/listings is up to date
        run: git diff --exit-code dist/listings

      - name: Validate the catalog (mirrors the client parsers)
        run: pnpm test

      - name: Typecheck
        run: pnpm run check
