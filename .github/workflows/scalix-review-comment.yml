name: Scalix Review Bot Comment

on:
  workflow_run:
    workflows: ["Scalix Review Bot"]
    types: [completed]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  comment:
    name: Post Maintainer Review Summary
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Resolve matching open PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run?.head_sha;
            if (!headSha) {
              core.setOutput('found', 'false');
              core.info('Missing workflow_run.head_sha; skipping.');
              return;
            }

            let match = null;
            for (const candidate of context.payload.workflow_run.pull_requests ?? []) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              if (pr.state === 'open' && pr.head.sha === headSha) {
                match = pr;
                break;
              }
            }

            if (!match) {
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              match = openPrs.find((p) => p.head.sha === headSha) ?? null;
            }

            if (!match) {
              core.setOutput('found', 'false');
              core.info(`No open PR matches head SHA ${headSha}; skipping.`);
              return;
            }

            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const isExternal = match.head.repo?.full_name !== baseRepo;

            core.setOutput('found', 'true');
            core.setOutput('pr_number', String(match.number));
            core.setOutput('base_ref', match.base.ref);
            core.setOutput('head_sha', match.head.sha);
            core.setOutput('is_external', isExternal ? 'true' : 'false');

      - name: Checkout trusted default branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - if: steps.pr.outputs.found == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - if: steps.pr.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate review report from isolated PR tree
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          IS_EXTERNAL: ${{ steps.pr.outputs.is_external }}
          SCALIX_REVIEW_BOT_API_KEY: ${{ secrets.SCALIX_REVIEW_BOT_API_KEY }}
          SCALIX_REVIEW_BOT_MODEL: ${{ vars.SCALIX_REVIEW_BOT_MODEL }}
          SCALIX_AI_BASE_URL: ${{ vars.SCALIX_AI_BASE_URL }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          ACTUAL_SHA="$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")"
          if [ "$ACTUAL_SHA" != "$HEAD_SHA" ]; then
            echo "PR #${PR_NUMBER} head SHA moved (${ACTUAL_SHA} != ${HEAD_SHA}); skipping comment."
            exit 0
          fi
          rm -rf /tmp/pr-tree
          git -c core.hooksPath=/dev/null worktree add --detach /tmp/pr-tree "$HEAD_SHA"
          trap 'git worktree remove --force /tmp/pr-tree >/dev/null 2>&1 || rm -rf /tmp/pr-tree' EXIT
          mkdir -p .review-out
          EXTRA_FLAGS=""
          if [ "$IS_EXTERNAL" = "true" ]; then
            EXTRA_FLAGS="--external"
          fi
          set +e
          pnpm exec tsx bin/review-pr.ts \
            --repo-root /tmp/pr-tree \
            --base "origin/${BASE_REF}" \
            --head "$HEAD_SHA" \
            $EXTRA_FLAGS \
            --output .review-out/review-report.json
          REVIEW_EXIT=$?
          set -e
          export REVIEW_EXIT
          if [ ! -f .review-out/review-report.json ]; then
            node -e '
              const fs = require("node:fs");
              const finding = {
                severity: "CRITICAL", file: "catalog", line: 1,
                title: "Review runner failed closed",
                explanation: `The review process exited with status ${process.env.REVIEW_EXIT} without a report. Inspect the workflow log and rerun before merging.`,
                source: "deterministic",
              };
              const report = {
                status: "fail", recommendation: "Address before merge",
                counts: { critical: 1, warning: 0, suggestion: 0 },
                ai_review_status: "error", ai_review_note: "Review runner failed before producing a report.",
                findings: [finding], maintainer_checks: [], reviewed_files: [],
                comment_markdown: `<!-- scalix-review-bot -->\n\n## Scalix Maintainer Review Summary\n\n**Status:** Review runner failed | **Recommendation:** Address before merge\n\n${finding.explanation}`,
              };
              fs.writeFileSync(".review-out/review-report.json", JSON.stringify(report));
            '
          fi

      - name: Publish maintainer gate
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('.review-out/review-report.json', 'utf8'));
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            if (!Number.isInteger(prNumber) || prNumber <= 0 || !/^[0-9a-f]{40}$/.test(headSha || '')) {
              throw new Error('Invalid PR metadata for maintainer gate.');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            if (pr.state !== 'open' || pr.head.sha !== headSha) {
              core.info('PR head moved or closed; skipping maintainer gate.');
              return;
            }
            const findings = Array.isArray(report.findings) ? report.findings : [];
            const passing = report.status === 'pass' && findings.length === 0;
            const summary = typeof report.comment_markdown === 'string'
              ? report.comment_markdown.slice(0, 65000)
              : 'Review completed without a summary.';
            const checkName = 'Scalix Maintainer Review';
            const existingRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha,
              check_name: checkName, per_page: 100,
            });
            const existing = existingRuns
              .filter(run => run.app?.slug === 'github-actions')
              .sort((a, b) => b.id - a.id)[0];
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: checkName,
              head_sha: headSha,
              status: 'completed',
              conclusion: passing ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: passing ? 'Maintainer review passed' : 'Maintainer review requires changes',
                summary,
              },
            };
            if (existing) {
              const { head_sha, ...updatePayload } = payload;
              await github.rest.checks.update({ ...updatePayload, check_run_id: existing.id });
            } else {
              await github.rest.checks.create(payload);
            }

      - name: Upsert PR review comment
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('.review-out/review-report.json', 'utf8'));
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            if (!Number.isInteger(prNumber) || prNumber <= 0 || !/^[0-9a-f]{40}$/.test(headSha || '')) {
              throw new Error('Invalid PR metadata for review comment.');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            if (pr.state !== 'open' || pr.head.sha !== headSha) {
              core.info('PR head moved or closed; skipping summary comment.');
              return;
            }
            const marker = '<!-- scalix-review-bot -->';
            let body = typeof report.comment_markdown === 'string' ? report.comment_markdown.trim() : '';
            if (!body.startsWith(marker)) throw new Error('Unexpected review summary payload.');
            if (body.length > 65000) body = `${body.slice(0, 64900)}\n\n… truncated by scalix-review-bot …`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' && comment.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            }

      - name: Post idempotent inline findings
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('.review-out/review-report.json', 'utf8'));
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            if (pr.state !== 'open' || pr.head.sha !== headSha) {
              core.info('PR head moved or closed; skipping inline findings.');
              return;
            }
            const marker = `<!-- scalix-review-bot-inline:${headSha} -->`;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            if (reviews.some(review => review.user?.login === 'github-actions[bot]' && review.body?.includes(marker))) {
              core.info('Inline findings already exist for this head SHA.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            const rightLines = (patch) => {
              const lines = new Set();
              let current = 0;
              for (const row of String(patch || '').split(/\r?\n/)) {
                const hunk = row.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (hunk) { current = Number(hunk[1]); continue; }
                if (!current || row.startsWith('-') || row.startsWith('\\')) continue;
                if (row.startsWith('+') || row.startsWith(' ')) lines.add(current);
                if (!row.startsWith('diff ') && !row.startsWith('index ')) current += 1;
              }
              return lines;
            };
            const diffByFile = new Map(files.map(file => [file.filename, rightLines(file.patch)]));
            const allowed = new Set(['CRITICAL', 'WARNING', 'SUGGESTION']);
            const clean = (value, cap) => String(value)
              .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, '')
              .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/@/g, '&#64;')
              .slice(0, cap);
            const comments = (Array.isArray(report.findings) ? report.findings : [])
              .filter(finding => finding && allowed.has(finding.severity) &&
                typeof finding.file === 'string' && Number.isInteger(finding.line) &&
                typeof finding.title === 'string' && typeof finding.explanation === 'string' &&
                diffByFile.get(finding.file)?.has(finding.line))
              .slice(0, 50)
              .map(finding => ({
                path: finding.file,
                line: finding.line,
                side: 'RIGHT',
                body: `**${finding.severity}: ${clean(finding.title, 200)}**\n\n${clean(finding.explanation, 4000)}`,
              }));
            if (!comments.length) {
              core.info('No findings map to valid RIGHT-side diff lines.');
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: headSha,
              event: 'COMMENT',
              body: `${marker}\nAutomated findings for ${headSha}. The summary comment contains any findings that cannot be anchored to this diff.`,
              comments,
            });
