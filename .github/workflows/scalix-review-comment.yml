name: Scalix Review Bot Comment

on:
  workflow_run:
    workflows: ["Scalix Review Bot"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    name: Post Maintainer Review Summary
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Resolve matching open PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run?.head_sha;
            if (!headSha) {
              core.setOutput('found', 'false');
              core.info('Missing workflow_run.head_sha; skipping.');
              return;
            }

            let match = null;
            for (const candidate of context.payload.workflow_run.pull_requests ?? []) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              if (pr.state === 'open' && pr.head.sha === headSha) {
                match = pr;
                break;
              }
            }

            if (!match) {
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              match = openPrs.find((p) => p.head.sha === headSha) ?? null;
            }

            if (!match) {
              core.setOutput('found', 'false');
              core.info(`No open PR matches head SHA ${headSha}; skipping.`);
              return;
            }

            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const isExternal = match.head.repo?.full_name !== baseRepo;

            core.setOutput('found', 'true');
            core.setOutput('pr_number', String(match.number));
            core.setOutput('base_ref', match.base.ref);
            core.setOutput('head_sha', match.head.sha);
            core.setOutput('is_external', isExternal ? 'true' : 'false');

      - name: Checkout trusted default branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - if: steps.pr.outputs.found == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - if: steps.pr.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate review report from isolated PR tree
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          IS_EXTERNAL: ${{ steps.pr.outputs.is_external }}
          SCALIX_REVIEW_BOT_API_KEY: ${{ secrets.SCALIX_REVIEW_BOT_API_KEY }}
          SCALIX_REVIEW_BOT_MODEL: ${{ vars.SCALIX_REVIEW_BOT_MODEL }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          ACTUAL_SHA="$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")"
          if [ "$ACTUAL_SHA" != "$HEAD_SHA" ]; then
            echo "PR #${PR_NUMBER} head SHA moved (${ACTUAL_SHA} != ${HEAD_SHA}); skipping comment."
            exit 0
          fi
          rm -rf /tmp/pr-tree
          git -c core.hooksPath=/dev/null worktree add --detach /tmp/pr-tree "$HEAD_SHA"
          trap 'git worktree remove --force /tmp/pr-tree >/dev/null 2>&1 || rm -rf /tmp/pr-tree' EXIT
          mkdir -p .review-out
          EXTRA_FLAGS=""
          if [ "$IS_EXTERNAL" = "true" ]; then
            EXTRA_FLAGS="--external"
          fi
          pnpm exec tsx bin/review-pr.ts \
            --repo-root /tmp/pr-tree \
            --base "origin/${BASE_REF}" \
            --head "$HEAD_SHA" \
            $EXTRA_FLAGS \
            --output .review-out/review-report.json || true

      - name: Upsert PR review comment
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('.review-out/review-report.json')) {
              core.info('Review report file not present; skipping comment.');
              return;
            }
            const report = JSON.parse(fs.readFileSync('.review-out/review-report.json', 'utf8'));
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            if (!Number.isInteger(prNumber) || prNumber <= 0 || !headSha) {
              throw new Error(`Invalid PR metadata: prNumber=${prNumber}, headSha=${headSha}`);
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.sha !== headSha) {
              core.info(`PR #${prNumber} head SHA moved (${pr.head.sha} != ${headSha}); skipping comment.`);
              return;
            }

            const body = typeof report.comment_markdown === 'string' ? report.comment_markdown.trim() : '';
            const marker = '<!-- scalix-review-bot -->';
            if (!body.startsWith(marker)) {
              throw new Error('Unexpected review-report.json comment_markdown payload.');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment ${existing.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created review comment on PR #${prNumber}`);
            }
