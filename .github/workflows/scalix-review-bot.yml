name: Scalix Review Bot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    name: Scalix Review Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run catalog tests and typecheck
        run: |
          pnpm test
          pnpm run check

      - name: Run Scalix Review Bot
        id: bot
        env:
          # Never expose the semantic-review secret to PR-controlled tests/code.
          # The trusted workflow_run pass performs the optional AI review.
          SCALIX_REVIEW_BOT_MODEL: ${{ vars.SCALIX_REVIEW_BOT_MODEL }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          mkdir -p .review-out
          EXTRA_FLAGS=""
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            EXTRA_FLAGS="--external"
          fi
          git fetch --no-tags origin "${BASE_REF}"
          set +e
          pnpm exec tsx bin/review-pr.ts \
            --base "origin/${BASE_REF}" \
            $EXTRA_FLAGS \
            --output .review-out/review-report.json
          EXIT_CODE=$?
          set -e
          if [ -f .review-out/review-report.json ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            node -e '
              const fs = require("node:fs");
              const report = JSON.parse(fs.readFileSync(".review-out/review-report.json", "utf8"));
              if (typeof report.comment_markdown === "string") {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report.comment_markdown + "\n");
              }
            '
          fi
          exit "$EXIT_CODE"
